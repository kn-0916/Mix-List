<style>
  :root{
    --bg:#000000;
    --surface:#0d0d0d;
    --surface2:#181818;
    --line:#2a2a2a;
    --text:#eeeeee;
    --sub:#787878;
    --amber:#f2b84b;
    --amber-dim:#5c4a22;
    --danger:#d1495b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:'Zen Kaku Gothic New',sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{
    width:100%;
    max-width:560px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .masthead h1{
    margin:0;
    display:flex;
    align-items:center;
  }
  .masthead h1 img{
    height:32px;
    width:auto;
    display:block;
  }
  .masthead .count{
    font-family:'Zen Kaku Gothic New',sans-serif;
    color:var(--sub);
    font-size:13px;
  }
  .playlist-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .playlist-bar select{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .playlist-bar select:focus{outline:none;border-color:var(--amber-dim);}
  .pl-btn{
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    width:38px;
    height:38px;
    flex-shrink:0;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:15px;
  }
  .pl-btn:hover{border-color:var(--amber-dim);}
  .deck{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .screen{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
  }
  #player{
    width:100%;
    height:100%;
  }
  .screen.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--sub);
    font-size:14px;
  }
  .deck-body{
    padding:14px 16px;
  }
  .track-info{
    font-size:14px;
    color:var(--sub);
    margin-bottom:10px;
    min-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-info b{color:var(--text);font-weight:500;}
  .counter-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .counter{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:15px;
    color:var(--amber);
    min-width:96px;
  }
  .bar{
    flex:1;
    height:3px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:var(--amber);
    width:0%;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:14px;
  }
  .ctl-btn{
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .15s;
  }
  .ctl-btn:hover{border-color:var(--amber-dim);}
  .ctl-btn.play{width:52px;height:40px;}
  .ctl-btn.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1c1608;
  }
  .ctl-btn svg{width:16px;height:16px;fill:currentColor;}
  .add-form{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .add-form input[type=text]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:11px 12px;
    font-size:14px;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .add-form input[type=text]:focus{outline:none;border-color:var(--amber-dim);}
  .add-form button{
    background:var(--amber);
    border:none;
    color:#1c1608;
    font-weight:600;
    font-size:14px;
    padding:0 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .add-form button:disabled{opacity:.5;cursor:default;}
  .queue{
    list-style:none;
    margin:0;padding:0;
  }
  .queue li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:8px;
  }
  .queue li.current{border-color:var(--amber);}
  .q-num{
    font-family:'Zen Kaku Gothic New',sans-serif;
    color:var(--sub);
    font-size:13px;
    width:20px;
    text-align:right;
    flex-shrink:0;
  }
  .queue li.current .q-num{color:var(--amber);}
  .q-main{
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  .q-title{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .q-range{
    display:flex;
    gap:6px;
    margin-top:5px;
  }
  .q-range label{
    font-size:11px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:4px;
  }
  .q-range input{
    width:56px;
    background:var(--surface2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:5px;
    padding:3px 5px;
    font-size:12px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    text-align:center;
  }
  .q-remove{
    background:none;
    border:none;
    color:var(--sub);
    cursor:pointer;
    padding:4px;
    flex-shrink:0;
  }
  .q-remove:hover{color:var(--danger);}
  .q-remove svg{width:16px;height:16px;fill:currentColor;}
  .empty-state{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:8px;
  }
</style>
</head>
<body>

<script>
let playlists = [];
let activeId = null;
let tracks = [];
let order = [];
let currentPos = -1;
let shuffleOn = false;
let ytPlayer = null;
let playerReady = false;
let progressTimer = null;

const el = id => document.getElementById(id);

function genId(){
  return crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
}

function currentPlaylist(){
  return playlists.find(p=>p.id===activeId) || playlists[0];
}

function extractVideoId(url){
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
    /(?:youtube\.com\/shorts\/)([\w-]{11})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function parseTimeToSeconds(str){
  str = (str||'').trim();
  if(!str) return null;
  if(str.includes(':')){
    const parts = str.split(':').map(p=>parseInt(p,10));
    if(parts.some(isNaN)) return null;
    if(parts.length === 2) return parts[0]*60 + parts[1];
    if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    return null;
  }
  const n = parseInt(str,10);
  return isNaN(n) ? null : n;
}

async function fetchTitle(videoId){
  try{
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
    if(!res.ok) throw new Error('fail');
    const data = await res.json();
    return data.title || videoId;
  }catch(e){
    return videoId;
  }
}

function loadData(){
  try{
    const raw = localStorage.getItem('mixlist_data');
    if(raw){
      const data = JSON.parse(raw);
      playlists = data.playlists || [];
      activeId = data.activeId;
    }else{
      // 旧バージョン(単一プレイリスト)からの引き継ぎ
      const legacy = localStorage.getItem('mixtape_tracks');
      const legacyTracks = legacy ? JSON.parse(legacy) : [];
      const id = genId();
      playlists = [{id, name:'マイリスト', tracks: legacyTracks}];
      activeId = id;
    }
  }catch(e){
    playlists = [];
  }
  if(!playlists || playlists.length === 0){
    const id = genId();
    playlists = [{id, name:'マイリスト', tracks: []}];
    activeId = id;
  }
  if(!playlists.find(p=>p.id===activeId)){
    activeId = playlists[0].id;
  }
  tracks = currentPlaylist().tracks;
  rebuildOrder();
  renderPlaylistSelect();
  render();
}

function saveData(){
  try{
    localStorage.setItem('mixlist_data', JSON.stringify({playlists, activeId}));
  }catch(e){
    console.error('save failed', e);
  }
}

function renderPlaylistSelect(){
  el('playlistSelect').innerHTML = playlists.map(p =>
    `<option value="${p.id}" ${p.id===activeId?'selected':''}>${escapeHtml(p.name)}</option>`
  ).join('');
}

function resetPlayerView(){
  currentPos = -1;
  if(ytPlayer){ try{ ytPlayer.stopVideo(); }catch(e){} }
  el('screenEmpty').style.display = 'flex';
  el('player').style.display = 'none';
  el('trackInfo').textContent = '再生待機中';
  el('counter').textContent = '00:00 / 00:00';
  el('barFill').style.width = '0%';
}

function switchPlaylist(id){
  activeId = id;
  tracks = currentPlaylist().tracks;
  resetPlayerView();
  rebuildOrder();
  render();
  saveData();
}

el('playlistSelect').addEventListener('change', (e)=>{
  switchPlaylist(e.target.value);
});

el('btnNewPlaylist').addEventListener('click', ()=>{
  const name = prompt('新しいプレイリスト名を入力');
  if(name === null) return;
  const id = genId();
  playlists.push({id, name: name.trim() || '新規プレイリスト', tracks: []});
  activeId = id;
  tracks = currentPlaylist().tracks;
  resetPlayerView();
  rebuildOrder();
  renderPlaylistSelect();
  render();
  saveData();
});

el('btnRenamePlaylist').addEventListener('click', ()=>{
  const p = currentPlaylist();
  const name = prompt('新しい名前を入力', p.name);
  if(name === null) return;
  p.name = name.trim() || p.name;
  renderPlaylistSelect();
  saveData();
});

el('btnDeletePlaylist').addEventListener('click', ()=>{
  if(playlists.length <= 1){
    alert('プレイリストは最低1つ必要です');
    return;
  }
  const p = currentPlaylist();
  if(!confirm(`「${p.name}」を削除します。よろしいですか？`)) return;
  playlists = playlists.filter(x=>x.id!==p.id);
  activeId = playlists[0].id;
  tracks = currentPlaylist().tracks;
  resetPlayerView();
  rebuildOrder();
  renderPlaylistSelect();
  render();
  saveData();
});

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function rebuildOrder(keepCurrentId){
  const ids = tracks.map(t=>t.id);
  order = shuffleOn ? shuffleArray(ids) : ids;
  if(keepCurrentId){
    currentPos = order.indexOf(keepCurrentId);
  }
}

function render(){
  const queueEl = el('queue');
  const emptyEl = el('emptyState');
  el('trackCount').textContent = tracks.length + ' tracks';

  if(tracks.length === 0){
    queueEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const currentId = currentPos >= 0 && order[currentPos] ? order[currentPos] : null;

  queueEl.innerHTML = tracks.map((t, idx) => `
    <li class="${t.id===currentId?'current':''}" data-id="${t.id}">
      <span class="q-num">${idx+1}</span>
      <div class="q-main" data-action="play">
        <div class="q-title">${escapeHtml(t.title)}</div>
        <div class="q-range">
          <label>IN <input type="text" inputmode="numeric" value="${fmtTime(t.start)}" placeholder="00:00" data-action="start"></label>
          <label>OUT <input type="text" inputmode="numeric" value="${t.end!=null?fmtTime(t.end):''}" placeholder="末尾" data-action="end"></label>
        </div>
      </div>
      <button class="q-remove" data-action="remove" title="削除">
        <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM9 10v8m3-8v8m3-8v8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
    </li>
  `).join('');

  el('btnShuffle').classList.toggle('active', shuffleOn);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

el('queue').addEventListener('click', (e)=>{
  const li = e.target.closest('li');
  if(!li) return;
  const id = li.dataset.id;
  const action = e.target.closest('[data-action]')?.dataset.action;

  if(action === 'remove'){
    tracks = tracks.filter(t=>t.id!==id);
    currentPlaylist().tracks = tracks;
    if(order[currentPos] === id){
      currentPos = -1;
      if(ytPlayer) ytPlayer.stopVideo();
    }
    rebuildOrder(order[currentPos]);
    saveData();
    render();
    return;
  }
  if(action === 'play'){
    rebuildOrder();
    currentPos = order.indexOf(id);
    playCurrent();
    return;
  }
});

el('queue').addEventListener('change', (e)=>{
  const li = e.target.closest('li');
  if(!li) return;
  const id = li.dataset.id;
  const track = tracks.find(t=>t.id===id);
  if(!track) return;
  const action = e.target.dataset.action;
  if(action === 'start'){
    const sec = parseTimeToSeconds(e.target.value);
    track.start = sec !== null ? Math.max(0, sec) : 0;
    e.target.value = fmtTime(track.start);
  }else if(action === 'end'){
    const sec = parseTimeToSeconds(e.target.value);
    track.end = (sec !== null) ? Math.max(0, sec) : null;
    e.target.value = track.end !== null ? fmtTime(track.end) : '';
  }
  saveData();
});

el('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = el('urlInput');
  const url = input.value.trim();
  if(!url) return;
  const videoId = extractVideoId(url);
  if(!videoId){
    input.style.borderColor = 'var(--danger)';
    setTimeout(()=>{input.style.borderColor='';}, 1200);
    return;
  }
  el('addBtn').disabled = true;
  const title = await fetchTitle(videoId);
  tracks.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random(),
    videoId, title, start: 0, end: null
  });
  input.value = '';
  el('addBtn').disabled = false;
  rebuildOrder(order[currentPos]);
  saveData();
  render();
});

function playCurrent(){
  if(currentPos < 0 || currentPos >= order.length) return;
  const id = order[currentPos];
  const track = tracks.find(t=>t.id===id);
  if(!track || !playerReady) return;

  el('screenEmpty').style.display = 'none';
  el('player').style.display = 'block';

  ytPlayer.loadVideoById({
    videoId: track.videoId,
    startSeconds: track.start || 0,
    endSeconds: track.end || undefined
  });
  ytPlayer.playVideo();
  el('trackInfo').innerHTML = '再生中: <b>'+escapeHtml(track.title)+'</b>';
  render();
}

function playNext(){
  if(order.length === 0) return;
  const wrapping = (currentPos + 1) >= order.length;
  if(wrapping && shuffleOn){
    // 1周し終えたら、シャッフルを引き直して継続する
    rebuildOrder();
    currentPos = 0;
  }else{
    currentPos = (currentPos + 1) % order.length;
  }
  playCurrent();
}

function playPrev(){
  if(order.length === 0) return;
  currentPos = (currentPos - 1 + order.length) % order.length;
  playCurrent();
}

el('btnNext').addEventListener('click', playNext);
el('btnPrev').addEventListener('click', playPrev);

el('btnShuffle').addEventListener('click', ()=>{
  shuffleOn = !shuffleOn;
  const currentId = currentPos>=0 ? order[currentPos] : null;
  rebuildOrder(currentId);
  render();
});

el('btnPlay').addEventListener('click', ()=>{
  if(!playerReady) return;
  if(currentPos < 0){
    if(tracks.length === 0) return;
    rebuildOrder();
    currentPos = 0;
    playCurrent();
    return;
  }
  const state = ytPlayer.getPlayerState();
  if(state === YT.PlayerState.PLAYING){
    ytPlayer.pauseVideo();
  }else{
    ytPlayer.playVideo();
  }
});

function updatePlayIcon(playing){
  el('iconPlay').innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function tickProgress(){
  if(!ytPlayer || !playerReady || currentPos < 0) return;
  const dur = ytPlayer.getDuration() || 0;
  const cur = ytPlayer.getCurrentTime() || 0;
  const track = tracks.find(t => order[currentPos] === t.id);
  const effEnd = track && track.end != null ? Math.min(track.end, dur) : dur;
  const effStart = track ? (track.start||0) : 0;
  const span = Math.max(effEnd - effStart, 0.001);
  const pct = Math.min(100, Math.max(0, ((cur-effStart)/span)*100));
  el('barFill').style.width = pct + '%';
  el('counter').textContent = fmtTime(cur - effStart) + ' / ' + fmtTime(span);

  // YouTube側のendSecondsだけだと効かないことがあるので、ここでも終了秒数を監視する
  if(track && track.end != null && cur >= track.end - 0.15){
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING){
      playNext();
    }
  }
}

function onPlayerReady(){
  playerReady = true;
}

function onPlayerStateChange(ev){
  if(ev.data === YT.PlayerState.PLAYING){
    updatePlayIcon(true);
  }else if(ev.data === YT.PlayerState.PAUSED){
    updatePlayIcon(false);
  }else if(ev.data === YT.PlayerState.ENDED){
    updatePlayIcon(false);
    playNext();
  }
}

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('player', {
    height: '100%',
    width: '100%',
    playerVars: { rel: 0, playsinline: 1 },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange
    }
  });
};

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(tag);

progressTimer = setInterval(tickProgress, 500);

loadData();
</script>
</body>
